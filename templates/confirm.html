{{define "body"}}
<p>Your network's address is <strong>{{.Data.IP}}</strong>.</p>
<p>Confirm to unlock Jellyfin for every device on this network.</p>
<p>Only confirm from your home Wi-Fi. On mobile data, a VPN or Private Relay the address above is shared with strangers, and confirming would unlock it for them.</p>
<form method="post" action="/verify">
<input type="hidden" name="token" value="{{.Data.Token}}">
<button type="submit">Unlock</button>
</form>
{{end}}
